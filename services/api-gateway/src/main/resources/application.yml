server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**
          filters:
            - name: JwtAuthFilter

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: mySecretKeyForJwtGeneration123456
